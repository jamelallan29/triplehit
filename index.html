<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIPLE HIT ACADEMY - Smart Football Group Distribution System</title>
    <style>
        /* =====================================================
           GLOBAL STYLES & PALETTE (ORANGE & WHITE)
           ===================================================== */

        :root {
            --primary-orange: #ff6600;
            --orange-hover: #e05500;
            --orange-light: #fff5ed;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --card-border: #333333;
            --text-white: #ffffff;
            --text-muted: #cccccc;
            --error-red: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-orange);
            font-size: 2em;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95em;
        }

        /* =====================================================
           STATUS BAR
           ===================================================== */

        .status {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-weight: bold;
            background-color: var(--card-bg);
            border: 1px solid var(--primary-orange);
            color: var(--text-white);
            transition: all 0.3s ease;
        }

        .status.success {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
        }

        .status.error {
            border-color: var(--error-red);
            color: var(--error-red);
        }

        .status.warning {
            border-color: #ffaa00;
            color: #ffaa00;
        }

        .status.info {
            border-color: #3182ce;
            color: #63b3ed;
        }

        /* =====================================================
           FORM & CONTROLS
           ===================================================== */

        #playerForm {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input[type="text"], select {
            padding: 10px 14px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-white);
            border-radius: 6px;
            outline: none;
            flex: 1;
            min-width: 180px;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-orange);
        }

        button {
            padding: 10px 18px;
            background-color: var(--primary-orange);
            color: var(--text-white);
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--orange-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #444444;
            color: #888888;
            cursor: not-allowed;
            border-color: #444444 !important;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .actions button {
            background-color: transparent;
            border: 2px solid var(--primary-orange);
            color: var(--text-white);
        }

        .actions button:hover:not(:disabled) {
            background-color: var(--primary-orange);
            color: var(--text-white);
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .section-title h2 {
            font-size: 1.2em;
            color: var(--primary-orange);
        }

        /* =====================================================
           PLAYERS LIST
           ===================================================== */

        .players-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        #playersList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #262626;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
        }

        .player-name {
            font-weight: bold;
            color: var(--text-white);
        }

        .player-level {
            font-size: 0.85em;
            color: var(--primary-orange);
        }

        .player-actions {
            display: flex;
            gap: 5px;
        }

        .player-actions button {
            padding: 4px 8px;
            font-size: 0.8em;
        }

        .player-actions .edit {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .player-actions .edit:hover {
            background-color: var(--card-border);
            color: var(--text-white);
        }

        .player-actions .remove {
            background-color: transparent;
            color: var(--error-red);
            border: 1px solid var(--error-red);
        }

        .player-actions .remove:hover {
            background-color: var(--error-red);
            color: var(--text-white);
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        /* =====================================================
           DISTRIBUTIONS & GROUPS GRID
           ===================================================== */

        .distribution-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 26px;
        }

        .distribution-card h3 {
            color: var(--primary-orange);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary-orange);
            padding-bottom: 6px;
        }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .group-card {
            background-color: #262626;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 12px;
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }

        .group-title-container {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex: 1;
        }

        .group-title-container h4 {
            color: var(--text-white);
            font-size: 1em;
            transition: color 0.2s;
        }

        .group-title-container:hover h4 {
            color: var(--primary-orange);
        }

        .edit-title-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.8em;
            cursor: pointer;
            padding: 2px 4px;
        }

        .edit-title-btn:hover {
            color: var(--primary-orange);
            background: none;
        }

        .group-score {
            font-size: 0.85em;
            background-color: var(--primary-orange);
            color: var(--text-white);
            padding: 2px 8px;
            border-radius: 12px;
            white-space: nowrap;
        }

        .group-players {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 4px;
            border: 1px dashed transparent;
            border-radius: 4px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .group-players.drag-over {
            border-color: var(--primary-orange);
            background-color: rgba(255, 102, 0, 0.1);
        }

        /* =====================================================
           PLAYER TAGS (SWAP & DRAG STYLES)
           ===================================================== */

        .group-player-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-white);
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        .group-player-tag:hover {
            border-color: var(--primary-orange);
        }

        .group-player-tag.dragging {
            opacity: 0.4;
        }

        .group-player-tag.selected-swap {
            border: 2px solid var(--primary-orange);
            background-color: rgba(255, 102, 0, 0.2);
            box-shadow: 0 0 8px rgba(255, 102, 0, 0.6);
        }

        .group-player-tag small {
            color: var(--primary-orange);
            font-weight: bold;
        }

        @media print {
            body {
                background-color: #fff;
                color: #000;
            }
            #playerForm, .actions, .players-container, .player-actions, .edit-title-btn {
                display: none !important;
            }
            .distribution-card, .group-card, .group-player-tag {
                background-color: #fff !important;
                color: #000 !important;
                border: 1px solid #ccc !important;
            }
            .group-score {
                background-color: #eee !important;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>TRIPLE HIT ACADEMY</h1>
        <p>Smart Football Group Distribution System</p>
    </header>

    <div id="status" class="status">System ready. Add players or click Demo.</div>

    <form id="playerForm">
        <input type="text" id="playerName" placeholder="Player Name" required>
        <select id="playerLevel" required>
            <option value="" disabled selected>Select Skill Level</option>
            <option value="1">Level 1 (Beginner)</option>
            <option value="2">Level 2 (Intermediate)</option>
            <option value="3">Level 3 (Advanced)</option>
            <option value="4">Level 4 (Pro)</option>
        </select>
        <button type="submit">Add Player</button>
    </form>

    <div class="players-container">
        <div class="section-title">
            <h2>Player Roster</h2>
            <span id="playerCounter">0 / 24</span>
        </div>
        <div id="playersList"></div>
    </div>

    <div class="actions">
        <button type="button" id="generateBtn">Generate Distributions</button>
        <button type="button" id="demoBtn">Load 24 Demo Players</button>
        <button type="button" id="undoBtn" disabled>Undo Last Swap</button>
        <button type="button" id="clearBtn">Clear All</button>
        <button type="button" id="printBtn">Print Distributions</button>
    </div>

    <div id="distributions"></div>

    <script>
        const MAX_PLAYERS = 24;
        const MAX_GROUP_SIZE = 4;
        const DISTRIBUTION_COUNT = 4;

        let players = [];
        let distributions = [];
        let undoStack = [];
        let draggedPlayer = null;
        let selectedPlayerForSwap = null;

        const playerForm = document.getElementById("playerForm");
        const playerName = document.getElementById("playerName");
        const playerLevel = document.getElementById("playerLevel");
        const playersList = document.getElementById("playersList");
        const playerCounter = document.getElementById("playerCounter");

        const generateBtn = document.getElementById("generateBtn");
        const demoBtn = document.getElementById("demoBtn");
        const clearBtn = document.getElementById("clearBtn");
        const undoBtn = document.getElementById("undoBtn");
        const printBtn = document.getElementById("printBtn");

        const distributionsBox = document.getElementById("distributions");
        const statusBox = document.getElementById("status");

        function checkElements() {
            const elements = {
                playerForm, playerName, playerLevel, playersList,
                playerCounter, generateBtn, demoBtn, clearBtn,
                undoBtn, printBtn, distributionsBox, statusBox
            };

            for (const [name, element] of Object.entries(elements)) {
                if (!element) return false;
            }
            return true;
        }

        function createId() {
            return Date.now().toString(36) + Math.random().toString(36).substring(2);
        }

        function escapeHTML(text) {
            return String(text).replace(/[&<>"']/g, function (character) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[character];
            });
        }

        function shuffle(array) {
            const result = [...array];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function setStatus(message, type = "") {
            if (!statusBox) return;
            statusBox.textContent = message;
            statusBox.className = "status";
            if (type) {
                statusBox.classList.add(type);
            }
        }

        function getGroupCount(playerCount) {
            return Math.ceil(playerCount / MAX_GROUP_SIZE);
        }

        function getGroupSizes(playerCount) {
            const groupCount = getGroupCount(playerCount);
            const baseSize = Math.floor(playerCount / groupCount);
            const extraPlayers = playerCount % groupCount;
            const sizes = [];

            for (let i = 0; i < groupCount; i++) {
                sizes.push(baseSize + (i < extraPlayers ? 1 : 0));
            }
            return sizes;
        }

        function editPlayer(id) {
            const player = players.find(p => p.id === id);
            if (!player) return;

            const newName = prompt("Edit Player Name:", player.name);
            if (newName === null) return;

            const trimmedName = newName.trim();
            if (!trimmedName) {
                setStatus("Player name cannot be empty.", "error");
                return;
            }

            const newLevelStr = prompt("Edit Player Level (1, 2, 3, or 4):", player.level);
            if (newLevelStr === null) return;

            const newLevel = Number(newLevelStr);
            if (![1, 2, 3, 4].includes(newLevel)) {
                setStatus("Invalid level. Please enter 1, 2, 3, or 4.", "error");
                return;
            }

            player.name = trimmedName;
            player.level = newLevel;

            distributions = [];
            undoStack = [];
            selectedPlayerForSwap = null;

            if (undoBtn) undoBtn.disabled = true;

            renderPlayers();
            renderDistributions();
            setStatus(`Updated player details for "${trimmedName}". Please regenerate distributions.`, "warning");
        }

        function renderPlayers() {
            if (!playerCounter || !playersList) return;

            playerCounter.textContent = `${players.length} / ${MAX_PLAYERS}`;
            playersList.innerHTML = "";

            if (players.length === 0) {
                playersList.innerHTML = `<p class="empty-state">No players added yet.</p>`;
                return;
            }

            players.forEach((player, index) => {
                const div = document.createElement("div");
                div.className = "player";
                div.innerHTML = `
                    <div>
                        <div class="player-name">${index + 1}. ${escapeHTML(player.name)}</div>
                        <div class="player-level">Level ${player.level}</div>
                    </div>
                    <div class="player-actions">
                        <button type="button" class="edit" data-id="${player.id}">Edit</button>
                        <button type="button" class="remove" data-id="${player.id}">Remove</button>
                    </div>
                `;

                div.querySelector(".edit").addEventListener("click", () => editPlayer(player.id));
                div.querySelector(".remove").addEventListener("click", () => {
                    players = players.filter(p => p.id !== player.id);
                    distributions = [];
                    undoStack = [];
                    selectedPlayerForSwap = null;

                    if (undoBtn) undoBtn.disabled = true;

                    renderPlayers();
                    renderDistributions();
                    setStatus("Player removed. Generate the distributions again.", "warning");
                });

                playersList.appendChild(div);
            });
        }

        if (playerForm) {
            playerForm.addEventListener("submit", function (event) {
                event.preventDefault();

                const name = playerName.value.trim();
                const level = Number(playerLevel.value);

                if (!name) {
                    setStatus("Please enter the player name.", "error");
                    return;
                }

                if (![1, 2, 3, 4].includes(level)) {
                    setStatus("Please select a valid level.", "error");
                    return;
                }

                if (players.length >= MAX_PLAYERS) {
                    setStatus("You already have 24 players.", "error");
                    return;
                }

                players.push({ id: createId(), name, level });
                playerName.value = "";
                playerLevel.value = "";

                renderPlayers();
                setStatus(`${players.length} player(s) added.`, "success");
            });
        }

        if (demoBtn) {
            demoBtn.addEventListener("click", function () {
                const names = [
                    "Ahmad", "Omar", "Yazan", "Laith", "Zaid", "Hamza",
                    "Sami", "Adam", "Ali", "Kareem", "Tareq", "Mohammad",
                    "Basil", "Anas", "Fadi", "Rami", "Ayman", "Nour",
                    "Yousef", "Malek", "Ibrahim", "Hadi", "Saeed", "Qais"
                ];

                players = names.map((name, index) => ({
                    id: createId(),
                    name: name,
                    level: Math.floor(index / 6) + 1
                }));

                distributions = [];
                undoStack = [];
                selectedPlayerForSwap = null;

                if (undoBtn) undoBtn.disabled = true;

                renderPlayers();
                renderDistributions();
                setStatus("24 demo players loaded successfully.", "success");
            });
        }

        function getGroupScore(group) {
            const playersList = group.players || group;
            return playersList.reduce((total, player) => total + Number(player.level), 0);
        }

        function getOverlap(groupA, groupB) {
            const playersA = groupA.players || groupA;
            const playersB = groupB.players || groupB;
            const ids = new Set(playersA.map(player => player.id));
            return playersB.filter(player => ids.has(player.id)).length;
        }

        function isValidGroup(group, previousDistributions) {
            const groupPlayers = group.players || group;
            if (groupPlayers.length < 2 || groupPlayers.length > MAX_GROUP_SIZE) return false;

            for (const distribution of previousDistributions) {
                for (const oldGroup of distribution) {
                    if (getOverlap(groupPlayers, oldGroup) > 2) return false;
                }
            }
            return true;
        }

        function getLevelDifference(group) {
            const groupPlayers = group.players || group;
            if (groupPlayers.length <= 1) return 0;
            const levels = groupPlayers.map(p => Number(p.level));
            return Math.max(...levels) - Math.min(...levels);
        }

        // ======================================================
        // FLEXIBLE ALGORITHM (HANDLES ANY LEVEL DISTRIBUTION)
        // ======================================================

        function generateDistribution(previousDistributions, mode = 1) {
            const ATTEMPTS = 1000;
            const groupSizes = getGroupSizes(players.length);
            const groupCount = groupSizes.length;

            let bestDistribution = null;
            let bestPenalty = Infinity;

            for (let attempt = 0; attempt < ATTEMPTS; attempt++) {
                let remaining = shuffle(players);

                // Different sorting strategies to create distinct distribution patterns
                if (mode === 1) {
                    remaining.sort((a, b) => Number(b.level) - Number(a.level));
                } else if (mode === 2) {
                    remaining.sort((a, b) => Number(a.level) - Number(b.level));
                }

                const distribution = [];
                let failed = false;

                for (let groupIndex = 0; groupIndex < groupCount; groupIndex++) {
                    const requiredSize = groupSizes[groupIndex];
                    let candidate = remaining.slice(0, requiredSize);

                    if (candidate.length < requiredSize) {
                        failed = true;
                        break;
                    }

                    // Check overlap constraint with past distributions
                    if (!isValidGroup(candidate, previousDistributions) && previousDistributions.length > 0 && attempt < 800) {
                        // Retry with shuffled remaining if overlap fails
                        remaining = shuffle(remaining);
                        candidate = remaining.slice(0, requiredSize);
                        if (!isValidGroup(candidate, previousDistributions)) {
                            failed = true;
                            break;
                        }
                    }

                    distribution.push({
                        name: `Group ${groupIndex + 1}`,
                        players: candidate
                    });

                    const selectedIds = new Set(candidate.map(p => p.id));
                    remaining = remaining.filter(p => !selectedIds.has(p.id));
                }

                if (failed || remaining.length !== 0) continue;

                // Calculate penalty to find the most balanced groups
                const scores = distribution.map(getGroupScore);
                const spread = Math.max(...scores) - Math.min(...scores);
                const levelDiffPenalty = distribution.reduce((sum, group) => sum + getLevelDifference(group.players) * 10, 0);
                const totalPenalty = (spread * 50) + levelDiffPenalty;

                if (totalPenalty < bestPenalty) {
                    bestPenalty = totalPenalty;
                    bestDistribution = distribution;
                }

                if (spread <= 1) return distribution;
            }

            return bestDistribution;
        }

        if (generateBtn) {
            generateBtn.addEventListener("click", function () {
                if (players.length < 4) {
                    setStatus(`At least 4 players are required. You currently have ${players.length}.`, "error");
                    return;
                }

                distributions = [];
                undoStack = [];
                selectedPlayerForSwap = null;
                if (undoBtn) undoBtn.disabled = true;

                const groupCount = getGroupCount(players.length);
                setStatus(`Generating ${DISTRIBUTION_COUNT} balanced distributions using ${groupCount} groups...`, "");

                setTimeout(function () {
                    let failedAt = 0;

                    for (let i = 0; i < DISTRIBUTION_COUNT; i++) {
                        const mode = (i % 3) + 1;
                        const distribution = generateDistribution(distributions, mode);

                        if (!distribution) {
                            failedAt = i + 1;
                            break;
                        }
                        distributions.push(distribution);
                    }

                    if (failedAt !== 0 || distributions.length !== DISTRIBUTION_COUNT) {
                        distributions = [];
                        renderDistributions();
                        setStatus("Could not generate all 4 distributions. Please click Generate again.", "error");
                        return;
                    }

                    renderDistributions();
                    setStatus(`Successfully generated 4 balanced distributions for ${players.length} players!`, "success");
                }, 30);
            });
        }

        function editGroupName(distIndex, groupIndex) {
            const groupObj = distributions[distIndex][groupIndex];
            const currentName = groupObj.name || `Group ${groupIndex + 1}`;
            
            const newName = prompt("Enter new Group Name:", currentName);
            if (newName === null) return;

            const trimmedName = newName.trim();
            if (!trimmedName) {
                setStatus("Group name cannot be empty.", "error");
                return;
            }

            saveUndoState();
            groupObj.name = trimmedName;
            renderDistributions();
            setStatus(`Group renamed to "${trimmedName}".`, "success");
        }

        function handlePlayerClick(distIndex, groupIndex, playerId) {
            const groupObj = distributions[distIndex][groupIndex];
            const player = groupObj.players.find(p => p.id === playerId);
            if (!player) return;

            if (selectedPlayerForSwap && selectedPlayerForSwap.id === playerId) {
                selectedPlayerForSwap = null;
                renderDistributions();
                setStatus("Swap canceled.", "info");
                return;
            }

            if (!selectedPlayerForSwap) {
                selectedPlayerForSwap = { distIndex, groupIndex, id: playerId, name: player.name };
                renderDistributions();
                setStatus(`Selected ${player.name}. Click another player in Distribution ${distIndex + 1} to swap.`, "info");
                return;
            }

            if (selectedPlayerForSwap.distIndex !== distIndex) {
                setStatus("You can only swap players within the same distribution.", "error");
                return;
            }

            if (selectedPlayerForSwap.groupIndex === groupIndex) {
                setStatus("Select a player from a DIFFERENT group to swap.", "warning");
                return;
            }

            saveUndoState();

            const sourceGroup = distributions[distIndex][selectedPlayerForSwap.groupIndex].players;
            const targetGroup = distributions[distIndex][groupIndex].players;

            const sourceIndex = sourceGroup.findIndex(p => p.id === selectedPlayerForSwap.id);
            const targetIndex = targetGroup.findIndex(p => p.id === playerId);

            if (sourceIndex !== -1 && targetIndex !== -1) {
                const temp = sourceGroup[sourceIndex];
                sourceGroup[sourceIndex] = targetGroup[targetIndex];
                targetGroup[targetIndex] = temp;
                setStatus(`Swapped ${temp.name} with ${sourceGroup[sourceIndex].name}.`, "success");
            }

            selectedPlayerForSwap = null;
            renderDistributions();
        }

        function renderDistributions() {
            if (!distributionsBox) return;
            distributionsBox.innerHTML = "";

            if (distributions.length === 0) {
                distributionsBox.innerHTML = `
                    <div class="empty-state">
                        <p>No distributions generated yet. Click "Generate Distributions" above.</p>
                    </div>
                `;
                return;
            }

            distributions.forEach((dist, distIndex) => {
                const distCard = document.createElement("div");
                distCard.className = "distribution-card";
                distCard.innerHTML = `
                    <h3>Distribution ${distIndex + 1}</h3>
                    <div class="groups-grid" data-dist-index="${distIndex}"></div>
                `;

                const groupsGrid = distCard.querySelector(".groups-grid");

                dist.forEach((groupObj, groupIndex) => {
                    const groupName = groupObj.name || `Group ${groupIndex + 1}`;
                    const groupPlayers = groupObj.players || groupObj;
                    const groupScore = getGroupScore(groupPlayers);
                    const groupCard = document.createElement("div");
                    groupCard.className = "group-card";

                    groupCard.innerHTML = `
                        <div class="group-header">
                            <div class="group-title-container" title="Click to rename group">
                                <h4>${escapeHTML(groupName)}</h4>
                                <button class="edit-title-btn">✏️</button>
                            </div>
                            <span class="group-score">Total Score: ${groupScore}</span>
                        </div>
                        <div class="group-players" data-dist-index="${distIndex}" data-group-index="${groupIndex}"></div>
                    `;

                    const titleContainer = groupCard.querySelector(".group-title-container");
                    titleContainer.addEventListener("click", () => editGroupName(distIndex, groupIndex));

                    const playersContainer = groupCard.querySelector(".group-players");

                    playersContainer.addEventListener("dragover", handleDragOver);
                    playersContainer.addEventListener("dragleave", handleDragLeave);
                    playersContainer.addEventListener("drop", handleDrop);

                    groupPlayers.forEach(player => {
                        const playerTag = document.createElement("div");
                        playerTag.className = "group-player-tag";

                        if (selectedPlayerForSwap && selectedPlayerForSwap.id === player.id) {
                            playerTag.classList.add("selected-swap");
                        }

                        playerTag.draggable = true;
                        playerTag.dataset.playerId = player.id;
                        playerTag.dataset.distIndex = distIndex;
                        playerTag.dataset.groupIndex = groupIndex;

                        playerTag.innerHTML = `
                            <span>${escapeHTML(player.name)}</span>
                            <small>Lvl ${player.level}</small>
                        `;

                        playerTag.addEventListener("click", (e) => {
                            e.stopPropagation();
                            handlePlayerClick(distIndex, groupIndex, player.id);
                        });
                        playerTag.addEventListener("dragstart", handleDragStart);
                        playerTag.addEventListener("dragend", handleDragEnd);

                        playersContainer.appendChild(playerTag);
                    });

                    groupsGrid.appendChild(groupCard);
                });

                distributionsBox.appendChild(distCard);
            });
        }

        function handleDragStart(e) {
            draggedPlayer = {
                id: this.dataset.playerId,
                distIndex: parseInt(this.dataset.distIndex, 10),
                groupIndex: parseInt(this.dataset.groupIndex, 10)
            };
            this.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", this.dataset.playerId);
        }

        function handleDragEnd() {
            this.classList.remove("dragging");
            draggedPlayer = null;
            document.querySelectorAll(".group-players").forEach(el => el.classList.remove("drag-over"));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            this.classList.add("drag-over");
        }

        function handleDragLeave() {
            this.classList.remove("drag-over");
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove("drag-over");

            if (!draggedPlayer) return;

            const targetDistIndex = parseInt(this.dataset.distIndex, 10);
            const targetGroupIndex = parseInt(this.dataset.groupIndex, 10);

            if (draggedPlayer.distIndex !== targetDistIndex) {
                setStatus("Players can only be swapped within the same distribution.", "error");
                return;
            }

            if (draggedPlayer.groupIndex === targetGroupIndex) return;

            const sourceGroup = distributions[targetDistIndex][draggedPlayer.groupIndex].players;
            const targetGroup = distributions[targetDistIndex][targetGroupIndex].players;

            const groupSizes = getGroupSizes(players.length);
            const targetMaxSize = groupSizes[targetGroupIndex];

            if (targetGroup.length >= targetMaxSize) {
                setStatus(`Group is already full.`, "error");
                return;
            }

            const playerIndex = sourceGroup.findIndex(p => p.id === draggedPlayer.id);
            if (playerIndex === -1) return;

            saveUndoState();

            const [movedPlayer] = sourceGroup.splice(playerIndex, 1);
            targetGroup.push(movedPlayer);

            selectedPlayerForSwap = null;
            renderDistributions();
            setStatus(`Moved ${movedPlayer.name} to new group.`, "warning");
        }

        function saveUndoState() {
            undoStack.push(JSON.parse(JSON.stringify(distributions)));
            if (undoBtn) undoBtn.disabled = false;
        }

        if (undoBtn) {
            undoBtn.addEventListener("click", function () {
                if (undoStack.length === 0) return;

                distributions = undoStack.pop();
                if (undoStack.length === 0) undoBtn.disabled = true;

                selectedPlayerForSwap = null;
                renderDistributions();
                setStatus("Last change undone.", "info");
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener("click", function () {
                players = [];
                distributions = [];
                undoStack = [];
                selectedPlayerForSwap = null;

                if (undoBtn) undoBtn.disabled = true;

                renderPlayers();
                renderDistributions();
                setStatus("All data cleared.", "info");
            });
        }

        if (printBtn) {
            printBtn.addEventListener("click", function () {
                if (distributions.length === 0) {
                    setStatus("Nothing to print. Generate distributions first.", "error");
                    return;
                }
                window.print();
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (checkElements()) {
                renderPlayers();
                renderDistributions();
                setStatus("System ready. Add players or click Demo.", "success");
            }
        });
    </script>
</body>
</html>
